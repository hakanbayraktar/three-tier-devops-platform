name: 02 — AWS App (ECR Build & GitOps Deploy)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/02-aws-app-deploy.yml'
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Özel İmaj Etiketi (Boş bırakılırsa git commit SHA kullanılır)'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPO: three-tier-backend
  ECR_FRONTEND_REPO: three-tier-frontend

jobs:
  build-and-push:
    name: Build, Scan & ECR Push
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitOps manifestini commit edebilmek için

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR Repositories if Not Exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_BACKEND_REPO }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository --repository-name ${{ env.ECR_BACKEND_REPO }} --region ${{ env.AWS_REGION }}

          aws ecr describe-repositories --repository-names ${{ env.ECR_FRONTEND_REPO }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository --repository-name ${{ env.ECR_FRONTEND_REPO }} --region ${{ env.AWS_REGION }}

      - name: Determine Image Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.tag_override }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------------
      # 1. Backend Docker Build & Push
      # ------------------------------------------------------------------------
      - name: Build and Push Backend Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          echo "===> Backend imajı derleniyor: $REGISTRY/$ECR_BACKEND_REPO:$TAG"
          docker build -t $REGISTRY/$ECR_BACKEND_REPO:$TAG ./backend
          docker tag $REGISTRY/$ECR_BACKEND_REPO:$TAG $REGISTRY/$ECR_BACKEND_REPO:latest
          docker push $REGISTRY/$ECR_BACKEND_REPO:$TAG
          docker push $REGISTRY/$ECR_BACKEND_REPO:latest

      # ------------------------------------------------------------------------
      # 2. Frontend Multi-Stage Docker Build & Push
      # ------------------------------------------------------------------------
      - name: Build and Push Frontend Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          echo "===> Frontend multi-stage imajı derleniyor: $REGISTRY/$ECR_FRONTEND_REPO:$TAG"
          docker build \
            --build-arg REACT_APP_API_BASE_URL="/backend" \
            -t $REGISTRY/$ECR_FRONTEND_REPO:$TAG ./frontend
          docker tag $REGISTRY/$ECR_FRONTEND_REPO:$TAG $REGISTRY/$ECR_FRONTEND_REPO:latest
          docker push $REGISTRY/$ECR_FRONTEND_REPO:$TAG
          docker push $REGISTRY/$ECR_FRONTEND_REPO:latest

      # ------------------------------------------------------------------------
      # 3. GitOps Dağıtım Adımı (Kustomize / Manifest Etiket Güncelleme)
      # ------------------------------------------------------------------------
      - name: Update GitOps Manifest with New Image Tag
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          echo "===> GitOps manifesti yeni imaj etiketiyle güncelleniyor: $TAG"
          # k8s/eks/kustomization.yaml dosyasını güncelle
          cat << KUST > k8s/eks/kustomization.yaml
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization

          resources:
            - ../base/00-namespace.yaml
            - ../base/01-mysql-secrets.yaml
            - ../base/03-mysql-deployment.yaml
            - ../base/04-backend.yaml
            - ../base/05-frontend.yaml
            - 01-storageclass-gp3.yaml
            - 02-mysql-pvc-ebs.yaml
            - 03-ingress-alb.yaml

          images:
            - name: three-tier-backend
              newName: $REGISTRY/$ECR_BACKEND_REPO
              newTag: '$TAG'
            - name: three-tier-frontend
              newName: $REGISTRY/$ECR_FRONTEND_REPO
              newTag: '$TAG'
          KUST

          # Git Değişikliklerini Commit Et (ArgoCD algılasın)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/eks/kustomization.yaml
          if git diff --staged --quiet; then
            echo "Herhangi bir manifest değişikliği yok."
          else
            git commit -m "gitops: update images to tag $TAG [skip ci]"
            git push origin main
            echo "✅ GitOps manifesti güncellendi ve push edildi. ArgoCD otomatik dağıtımı başlatacak!"
          fi
