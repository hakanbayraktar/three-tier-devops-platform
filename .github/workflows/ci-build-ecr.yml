name: CI — Build and Push to AWS ECR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci-build-ecr.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPO: three-tier-backend
  ECR_FRONTEND_REPO: three-tier-frontend

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # 1. Backend Build & Push
      # ------------------------------------------------------------------------
      - name: Build and Push Backend Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.SHA_SHORT }}
        run: |
          docker build -t $REGISTRY/$ECR_BACKEND_REPO:$TAG ./backend
          docker tag $REGISTRY/$ECR_BACKEND_REPO:$TAG $REGISTRY/$ECR_BACKEND_REPO:latest
          docker push $REGISTRY/$ECR_BACKEND_REPO:$TAG
          docker push $REGISTRY/$ECR_BACKEND_REPO:latest

      # ------------------------------------------------------------------------
      # 2. Frontend Multi-Stage Build & Push
      # ------------------------------------------------------------------------
      - name: Build and Push Frontend Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.SHA_SHORT }}
        run: |
          docker build \
            --build-arg REACT_APP_API_BASE_URL="/backend" \
            -t $REGISTRY/$ECR_FRONTEND_REPO:$TAG ./frontend
          docker tag $REGISTRY/$ECR_FRONTEND_REPO:$TAG $REGISTRY/$ECR_FRONTEND_REPO:latest
          docker push $REGISTRY/$ECR_FRONTEND_REPO:$TAG
          docker push $REGISTRY/$ECR_FRONTEND_REPO:latest

      # ------------------------------------------------------------------------
      # 3. Notification (No direct imperative deploy to EKS!)
      # ------------------------------------------------------------------------
      - name: Pipeline Completed
        run: |
          echo "✅ İmajlar başarıyla AWS ECR'a push edildi!"
          echo "ℹ️ Dağıtım, GitOps prensipleri gereği ArgoCD tarafından EKS kümesine senkronize edilecektir."
