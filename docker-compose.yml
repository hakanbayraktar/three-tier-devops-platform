services:
  # ----------------------------------------------------------------------------
  # 1. Database Tier: MySQL 8.0
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0-debian
    container_name: three-tier-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SuperSecretPass123!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-school}
      MYSQL_USER: ${MYSQL_USER:-school_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-SchoolUserPass456!}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - three-tier-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 2. Backend Tier: Node.js Express API (Port 3500)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: three-tier-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SuperSecretPass123!}
      DB_NAME: ${MYSQL_DATABASE:-school}
      DB_PORT: 3306
      PORT: 3500
    ports:
      - "3500:3500"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - three-tier-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3500/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. Frontend Tier: React SPA served by Nginx (Port 3000 -> 80)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:3500/backend}
    container_name: three-tier-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - three-tier-net

volumes:
  mysql-data:
    name: three-tier-mysql-data

networks:
  three-tier-net:
    name: three-tier-network
    driver: bridge
